services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pokemon_scouting:app
    environment:
      FLASK_ENV: production
      ENV_FOR_DYNACONF: production
      INSTANCE_PATH: /app/instance
    volumes:
      - ./:/app
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: pokemon_scouting:worker
    command: celery -A celery_worker.celery_app worker --loglevel=info --queues=pokemon_sync
    depends_on:
      - api
      - rabbitmq
    environment:
      FLASK_ENV: production
      ENV_FOR_DYNACONF: production
      INSTANCE_PATH: /app/instance
    volumes:
      - ./:/app
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
