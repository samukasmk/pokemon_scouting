services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pokemon_scouting:app
    environment:
      FLASK_ENV: production
    volumes:
      - ./:/app
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "5000:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
