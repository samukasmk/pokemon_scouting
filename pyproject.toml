[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-scout"
version = "0.1.0"
description = "Pokémon scouting data pipeline built with Flask"
readme = "GUIDE.md"
requires-python = ">=3.11"
authors = [{name = "Pokémon Scouts"}]
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "flask-smorest>=0.44,<0.45",
    "marshmallow>=3.21,<4.0",
    "marshmallow-sqlalchemy>=1.1,<2.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "coverage>=7.6,<8.0",
    "responses>=0.25,<0.26"
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "tests/*",
    "app/__main__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
testpaths = ["tests"]

